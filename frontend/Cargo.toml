[package]
name = "azeroth-dashboard-ui"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ferrox-front-core = "0.3.0"
ferrox-front-ui = "0.3.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Response", "RequestInit", "Headers", "console"] }
js-sys = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-timers = { version = "0.3", features = ["futures"] }

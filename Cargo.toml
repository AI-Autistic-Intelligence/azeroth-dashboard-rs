[package]
name = "azeroth-dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Incorporate ferrox modules from crates.io
ferrox-app = "*"
ferrox-utils = "*"
ferrox-config = "*"

tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.13.5", features = ["json"] }
sysinfo = "0.39.6"
rand = "0.8.5"
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "builder"] }
